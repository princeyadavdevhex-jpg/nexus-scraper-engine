name: Nexus Supreme Intel Engine

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nexus-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run Master Script
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }} 
        GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
        GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
      run: python main.py

    - name: Commit Engine Cache
      run: |
        git config --global user.name "Nexus-Bot"
        git config --global user.email "bot@nexus.ai"
        git add src/master_cve_index.json src/red_database_rules.json
        git commit -m "⚙️ Nexus Engine: Updated Red Database Cache" || echo "No changes to commit"
        git push
        
