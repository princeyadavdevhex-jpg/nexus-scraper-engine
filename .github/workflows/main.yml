name: Nexus Supreme Intel Engine v7.0

on:
  # Rozana subah (Server Time 04:00 AM) par apne aap chalega
  schedule:
    - cron: '0 4 * * *'
  # Jab tera mann kare tab manually button daba kar chalane ke liye
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nexus-operation:
    runs-on: ubuntu-latest
    
    # 30 minute ka timeout taaki agar koi site atak jaye toh Action apne aap band ho jaye (Tokens bachane ke liye)
    timeout-minutes: 45

    steps:
    - name: 📥 Repository Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Poori history fetch karna taaki git push mein error na aaye

    - name: 🐍 Python Setup (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Dependencies ko cache karna taaki agla run fast ho

    - name: 📦 Install Nexus Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth beautifulsoup4 lxml scrapegraphai huggingface_hub langchain-groq nest-asyncio PyGithub
        # Playwright ke browsers install karna
        playwright install chromium
        playwright install-deps

    - name: 🚀 Fire Nexus Engine
      env:
        # Saare 3 Groq Keys pass karna taaki script rotation kar sake
        GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
        GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
        GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
        # Hugging Face Vault Access
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # GitHub Private Vault Access (nexus-private-logs ke liye)
        GH_PAT: ${{ secrets.GH_PAT }}
      run: python main.py

    - name: ⚙️ Sync Engine Memory (Cache Only)
      # Ye step sirf tab chalega agar engine successfully data scrape kar le
      if: success()
      run: |
        git config --global user.name "Nexus-Intelligence-Bot"
        git config --global user.email "bot@nexus-empire.ai"
        
        # Pehle check karo ki folder aur files exist karti hain ya nahi
        mkdir -p src
        touch src/master_cve_index.json src/red_database_rules.json
        
        # SIRF ENGINE KI MEMORY FILES KO ADD KARNA
        # Vault wala folder (src/vault) isme kabhi add nahi hoga!
        git add src/master_cve_index.json src/red_database_rules.json
        
        # Agar koi change hai toh commit karo, warna "No changes" bol kar nikal jao
        git commit -m "⚙️ Nexus Engine: Global Index & Red-DB Updated [$(date '+%Y-%m-%d %H:%M')]" || echo "No index changes to commit"
        
        # Changes ko Public Repo mein push karna
        git push origin main
        
